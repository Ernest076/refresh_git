<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Links Profile - Ernest Mutua</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-5px);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .social-profile {
            /* Box Model Properties - demonstrates padding, margin, border */
            width: 400px;
            padding: 40px;
            margin: 20px;
            border: 1px solid #2a2a2a;
            border-radius: 16px;

            /* Visual Properties */
            background: #1f1f1f;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            position: relative;
            z-index: 10;
        }

        .profile-header {
            /* Box Model - margin for spacing */
            padding: 0;
            margin: 0 0 30px 0;

            /* Visual */
            text-align: center;
        }

        .profile-avatar {
            /* Box Model - width, height, padding, margin, border */
            width: 100px;
            height: 100px;
            padding: 4px;
            margin: 0 auto 20px auto;
            border: 3px solid #3b82f6;
            border-radius: 50%;

            /* Visual */
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 3s ease-in-out infinite;
        }

        .avatar-inner {
            /* Box Model */
            width: 100%;
            height: 100%;
            border-radius: 50%;

            /* Visual */
            background: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #ffffff;
            font-weight: 700;
        }

        .profile-name {
            /* Box Model - margin */
            padding: 0;
            margin: 0 0 8px 0;

            /* Visual */
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
        }

        .profile-location {
            /* Box Model - margin */
            padding: 0;
            margin: 0 0 12px 0;

            /* Visual */
            font-size: 14px;
            color: #10b981;
            font-weight: 500;
        }

        .profile-bio {
            /* Box Model - margin */
            padding: 0;
            margin: 0;

            /* Visual */
            font-size: 15px;
            color: #a1a1a1;
            font-style: italic;
        }

        .social-links {
            /* Box Model - padding, margin */
            padding: 0;
            margin: 0;

            /* Visual */
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .social-link {
            /* Box Model - padding, margin, border */
            padding: 16px 20px;
            margin: 0;
            border: 1px solid transparent;
            border-radius: 8px;

            /* Visual */
            background: #333333;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
        }

        .social-link:hover {
            background: #404040;
            border-color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
        }

        .social-link.instagram:hover {
            background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            border-color: #e1306c;
        }

        .social-link.tiktok:hover {
            background: #000000;
            border-color: #00f2ea;
            box-shadow: 0 4px 12px rgba(0, 242, 234, 0.3);
        }

        .social-link.snapchat:hover {
            background: #FFFC00;
            color: #000000;
            border-color: #FFFC00;
        }

        .social-link.whatsapp:hover {
            background: #25D366;
            border-color: #25D366;
        }

        .social-link.x:hover {
            background: #000000;
            border-color: #1DA1F2;
            box-shadow: 0 4px 12px rgba(29, 161, 242, 0.3);
        }

        /* Decorative elements */
        .deco-dots {
            position: fixed;
            display: grid;
            grid-template-columns: repeat(3, 8px);
            gap: 8px;
        }

        .deco-dots.top-left {
            top: 40px;
            left: 60px;
        }

        .deco-dots.bottom-right {
            bottom: 60px;
            right: 80px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #3b82f6;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        .deco-circle {
            position: fixed;
            width: 100px;
            height: 100px;
            border: 3px solid #3b82f6;
            border-radius: 50%;
            opacity: 0.3;
        }

        .circle-top-left {
            top: 20px;
            left: 20px;
        }

        .zigzag {
            position: fixed;
            bottom: 80px;
            left: 60px;
            width: 80px;
            height: 40px;
        }
    </style>
</head>
<body>
    <!-- Decorative elements -->
    <div class="deco-dots top-left">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

    <div class="deco-dots bottom-right">
        <div class="dot" style="background: #8b5cf6;"></div>
        <div class="dot" style="background: #8b5cf6;"></div>
        <div class="dot" style="background: #8b5cf6;"></div>
        <div class="dot" style="background: #8b5cf6;"></div>
        <div class="dot" style="background: #8b5cf6;"></div>
        <div class="dot" style="background: #8b5cf6;"></div>
    </div>

    <div class="deco-circle circle-top-left"></div>

    <div class="zigzag">
        <svg viewBox="0 0 80 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0 20 L10 5 L20 20 L30 5 L40 20 L50 5 L60 20 L70 5 L80 20" stroke="#8b5cf6" stroke-width="3" fill="none"/>
        </svg>
    </div>

    <!-- Social Profile Card -->
    <div class="social-profile">
        <div class="profile-header">
            <div class="profile-avatar">
                <div class="avatar-inner">EM</div>
            </div>

            <h1 class="profile-name">Ernest Mutua</h1>
            <p class="profile-location">Nairobi, Kenya</p>
            <p class="profile-bio">"Content creator and tech enthusiast"</p>
        </div>

        <ul class="social-links">
            <li>
                <a href="#" class="social-link instagram">Instagram</a>
            </li>
            <li>
                <a href="#" class="social-link tiktok">TikTok</a>
            </li>
            <li>
                <a href="#" class="social-link snapchat">Snapchat</a>
            </li>
            <li>
                <a href="#" class="social-link whatsapp">WhatsApp</a>
            </li>
            <li>
                <a href="#" class="social-link x">X</a>
            </li>
        </ul>
    </div>
</body>
</html>
