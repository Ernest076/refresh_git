<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .card {
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 20px;
            margin: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .card :hover {
            transform: scale(1.05);
        }

        
        .button {
            padding: 10px 20px;
            border: none;
            border-radius: 9px;
            background: purple;
            color: yellow;
        }
    </style>
</head>
</html>
