<!DOCTYPE html>
<html>

<head>
    <style>

        body {
            background: #111;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        .card {
            width: 300px;
            margin: 100px auto;
            padding: 20px;
            border-radius: 20px;
            background: #222;
            box-shadow: 0 0 20px gray;
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background: purple;
            color: white;
        }

    </style>
</head>

<body>

    <div class="card">

        <h1>Kanye West</h1>

        <p>Producer • Rapper • Designer</p>

        <button>Explore</button>

    </div>

</body>
</html>
