<!DOCTYPE html>
<html>
<head>
    <style>

        body {
            background: #114477;
            color:bisque;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .image>img {
            width: 300px;
            height: auto;
            border-radius: 10px;
            margin-top: 20px;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            margin-top: 20px;
            background-color: #337ab7;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .hover-effect:hover {
            background-color: #286090;
        }
        .rounded {
            border-radius: 10px;
        }
        .shadow {
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }          
    </style>
</head>
</html>
