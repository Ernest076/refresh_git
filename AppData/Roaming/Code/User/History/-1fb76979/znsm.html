<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--
        Embed another website's content
        within your website
        
        Attributes:
        src- link to the resource online
        width,height size of window(pixels)
        title- people with screen readers etc
        allow full screen- let the user go full screen
     -->

        <iframe
            width="560"
            height="315"
            src="https://youtu.be/svxwIa5mxjQ?si=tjY74vsdoIRGOGmu"
            title="Youtube video player"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write;
</body>
</html>
