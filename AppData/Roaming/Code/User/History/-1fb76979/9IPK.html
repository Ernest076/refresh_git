<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <!-- Embed another websites content within your website -->
        
        
        <!--Attributes:
        src- link to the resource online
        width, height ,size of window(pixels) 
        title- people with screen readers etc
        allow full screen- let the user go full screen -->
    
        <iframe width="560" height="315"
                src="https://youtu.be/zJ57lt2etsk?si=WSM8H83nnlnZuxiz"
                title="Youtube video player"
                frameborder="0"
                allow=""
            </iframe>
            
        
</body>
</html>
